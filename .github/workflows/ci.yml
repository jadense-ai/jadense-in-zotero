# 独立仓库验证与草稿发布：构建只执行一次，发布任务消费同一份已校验制品。
name: Verify and draft release

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve release and check tag
        id: release
        run: |
          node --input-type=module -e 'import { appendFileSync, readFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json", "utf8")); if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error("Tag must match package.json version"); appendFileSync(process.env.GITHUB_OUTPUT, `directory=release/zotero/v${version}\n`);'
      - run: pnpm test
      - run: pnpm run lint
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: zotero-release
          path: ${{ steps.release.outputs.directory }}/
          if-no-files-found: error

  draft-release:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zotero-release
          path: release
      - name: Verify and create draft
        working-directory: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check SHA256SUMS
          cat > release-notes.md <<'NOTES'
          同一份安装包支持 BYOK 与连接攻玉，自动更新继续使用攻玉官网更新源。
          本草稿需完成隔离 Zotero 安装与研究功能冒烟后再公开。
          官网分发应使用此处同一 XPI；不得覆盖已发布同版本制品。
          NOTES
          gh release create "$RELEASE_TAG" "jadense-in-zotero-$RELEASE_TAG.xpi" release-metadata.json SHA256SUMS --verify-tag --draft --title "Jadense in Zotero $RELEASE_TAG" --notes-file release-notes.md
