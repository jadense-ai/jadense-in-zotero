# 独立仓库验证与草稿发布：构建只执行一次，发布任务消费同一份已校验制品。
name: Verify and draft release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check release naming and README summaries
        run: node .github/scripts/check-docs.mjs
      - name: Resolve release and check tag
        id: release
        run: node .github/scripts/release.mjs resolve
      - name: Test release guards
        run: node --test .github/scripts/release.test.mjs
      - name: Test offline packaging
        run: python3 -m unittest discover -s scripts -p test_offline_suite.py
      - name: Test catalog preparation
        run: python3 -m unittest discover -s .github/scripts -p test_package_release.py
      - run: pnpm test
      - run: pnpm run lint
      - run: pnpm run build
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
      - if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zotero-preview
          path: ${{ steps.release.outputs.directory }}/
          if-no-files-found: error
          retention-days: 30

  package-offline:
    needs: verify
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install uv==0.9.3
      - id: release
        run: node .github/scripts/release.mjs resolve
      - name: Build portable engines, matching XPI and offline ZIP
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/package-release.py --repository "$env:RELEASE_REPOSITORY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zotero-release
          path: ${{ steps.release.outputs.directory }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  draft-release:
    needs: [verify, package-offline]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zotero-release
          path: release-assets
      - name: Verify and create draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node .github/scripts/release.mjs draft release-assets
